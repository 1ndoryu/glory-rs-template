[package]
name = "glory-backend"
version = "0.1.0"
edition = "2021"
description = "Glory RS — Template para sitios web con Rust + React + OpenAPI"
license = "MIT"
authors = ["1ndoryu"]

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }
# [249A-1] Miniaturas de tabla: solo codecs puros Rust (sin libs del sistema).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "uuid", "chrono", "json"] }

# OpenAPI
utoipa = { version = "4", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

# Environment
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"

# Auth
jsonwebtoken = "9"
argon2 = "0.5"

# Utils
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
# [299A-1 E11] data-URL base64 de fotos entrantes para `describir_foto`
# (version ya en el arbol como transitiva: sin descarga nueva).
base64 = "0.22"
# [011A-5 Fase1] `idempotency_key` determinista (sha256 hex, puro Rust):
# `sha256("{ambito}:{motivo}:{texto}")`, sin secreto (no es HMAC).
# `0.10`: ya estaba en el arbol como transitiva (0.10.9), sin descarga.
sha2 = "0.10"

# Chat visitante con IA (169A-1): git-dep pineado (el build de prod del
# manager clona el repo dentro de la imagen en /build y el path-dep
# `../glory-agent` no existe alli; el pin hace el build hermetico).
# [011A-5 Fase0] `8560269`: nucleo F1-F4 (channels + outbox idempotente +
# adapter + handoff) con gate PASS; desciende de `e4ad5d7` (incluye 289A-5/6).
glory-agent = { git = "https://github.com/1ndoryu/glory-agent.git", rev = "856026948d18bc17d6b68ebc4cfdddbc9e90ffca" }

# Avisos WhatsApp del chat (169A-4): POST al gateway desde el worker.
# [309A-4] `multipart` para STT de notas de voz (Groq transcriptions).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tokio-test = "0.4"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
